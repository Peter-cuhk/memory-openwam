type: libero

# LeRobot v3 LIBERO; no conversion.json or EEF10 conversion required.
dataset_dir: /mnt/cpfs/Data/LIBERO-fastwam

# action: [delta xyz3, delta rotation command3, gripper open 0/1] (7-D)
# observation.state: [EEF xyz3, axis-angle3, finger qpos2] (8-D)
# The stored roll/pitch/yaw labels denote axis-angle coordinates, NOT Euler.
action_mode: eef
# 启用 unify 时须分别指定 7 维 action 和 8 维 state 的目标槽位，模型维度均设为 80。
# 例如 unify_action_map: ["0-6"]，unify_state_map: ["0-7"]。
unify_action: false
unify_action_map: null
unify_state_map: null

# Source FPS is read from meta/info.json; video_stride subsamples video only.
# action[t] starts at image[t]/state[t]; no +1 shift.
# 33 source timesteps -> 9 video frames, 32 actions, initial state as proprio input.
num_frames: 33
video_stride: 4
window_stride: 1
split: train

# L-shape: head 256x320, wrist 128x160 bottom-left, black bottom-right.
height: 384
width: 320
multiview: true
camera_layout: [observation.images.image, observation.images.wrist_image, null]
target_camera: null  # used only for single-view mode

# Independent per-dimension action/state stats, including axis-angle coords.
# Options: min-max, z-score, quantile, null (disabled).
# Default stats: <dataset_dir>/meta/libero_normalization_stats.npy.
# Missing stats are generated from the TRAIN split only by rank 0.
normalize_mode: min-max
normalization_stats_path: /mnt/cpfs/feiyang/code/OpenWAM/assets/benchmark_data/libero/meta/libero_normalization_stats.npy

# ── Video augmentation (optional) ────────────────────────────────────────────
# Load-time color jitter applied by the reader to each clip with the SAME
# random factors across all frames (temporal consistency), TRAIN split only.
# enabled: false keeps video byte-identical while preserving the knobs.
color_jitter:
  enabled: false
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0

# Run scripts/precompute_t5_embeddings.py first; null uses online T5 encoding.
text_embedding_cache_path: /mnt/cpfs/feiyang/cache/openwam/libero/t5_embeddings.pt
